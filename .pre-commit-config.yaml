default_language_version:
  python: python3

exclude: ^vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: validate-graph
        name: validate graph, relation catalogue and question traversals
        entry: python3 scripts/validate_graph.py
        language: system
        pass_filenames: false
        files: ^(c5_enterprise_architecture_knowledge_graph_v5_causal_temporal\.json|index\.html|docs/question-traversals\.md|scripts/validate_graph\.py)$
